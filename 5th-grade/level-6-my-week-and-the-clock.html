<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Week and the Clock - Level 6</title>
<style>
/* =========================================================
   ESTETICA: pixel art 8-bit, juego de aventura. Paleta PICO-8.
   Sin fuentes externas y SIN SONIDO de ninguna clase.
   ========================================================= */
:root{
  --negro:#000000; --noche:#1D2B53; --vino:#7E2553; --bosque:#008751;
  --tierra:#AB5236; --piedra:#5F574F; --gris:#C2C3C7; --hueso:#FFF1E8;
  --rojo:#FF004D; --naranja:#FFA300; --amarillo:#FFEC27; --verde:#00E436;
  --cielo:#29ADFF; --lila:#83769C; --rosa:#FF77A8; --durazno:#FFCCAA;
  --mono:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--mono); color:var(--hueso); min-height:100vh;
  padding:18px 12px 0; line-height:1.55;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),
    radial-gradient(var(--lila) 1px,transparent 1.5px) 0 0/48px 48px,
    radial-gradient(var(--cielo) 1px,transparent 1.5px) 24px 24px/72px 72px,
    linear-gradient(180deg,#0b1430 0%,var(--noche) 45%,#2a1042 100%);
  background-attachment:fixed;
  image-rendering:pixelated;
}
.wrap{max-width:900px;margin:0 auto}

/* ---------- fuente pixel dibujada en SVG ----------
   Se fija la ALTURA, no el ancho: si se fijara el ancho, un titulo corto
   ("LEVEL 4") saldria con pixeles enormes y uno largo ("MY WEEK AND THE
   CLOCK") con pixeles diminutos, y la pantalla queda despareja. Con la altura
   fija todos tienen el mismo pixel, y max-width lo achica solo si no entra. */
svg.pxt{display:block;width:auto;max-width:100%;fill:currentColor}
/* Las alturas son multiplos exactos de los 7px del glifo: a 2x, 3x o 4x el
   borde queda duro. A 9 u 11 px el pixel cae entre medio y el texto se
   emborrona, que es justo lo contrario de lo que busca el 8-bit. */
.pxt-h1{height:clamp(28px,7vw,56px)}   /* 4x a 8x */
.pxt-h2{height:28px}                   /* 4x */
.pxt-h3{height:21px}                   /* 3x */
.pxt-tag{height:14px}                  /* 2x */
.pxt-btn{height:14px}                  /* 2x */
.pxt-mini{height:14px}                 /* 2x */

/* ---------- marco general ---------- */
.hero{
  background:linear-gradient(180deg,var(--vino) 0%,#3a1140 100%);
  border:4px solid var(--hueso);
  box-shadow:0 0 0 4px var(--negro), 10px 10px 0 rgba(0,0,0,.55);
  padding:18px 18px 20px; margin-bottom:22px;
}
.hero .tag{color:var(--amarillo);display:block;margin-bottom:12px}
.hero h1{margin:0 0 10px;color:var(--hueso)}
.hero .goal{
  color:var(--durazno); font-size:.86rem; margin:0;
  border-left:4px solid var(--naranja); padding-left:10px;
}

/* ---------- barra de progreso segmentada ---------- */
.hud{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  border:4px solid var(--negro); background:rgba(0,0,0,.45);
  padding:9px 11px; margin-bottom:20px;
}
.hud .hudlab{color:var(--amarillo)}
.segbar{display:flex; gap:3px; flex:1 1 180px; min-width:140px}
.seg{
  flex:1 1 0; height:14px; background:var(--piedra);
  border:2px solid var(--negro); min-width:8px;
}
.seg.on{background:var(--verde)}
.seg.part{background:var(--naranja)}
.hud .hudscore{color:var(--hueso); font-size:.8rem}

/* ---------- tarjetas ---------- */
.card{
  background:linear-gradient(180deg,#141d3e 0%,#0d1430 100%);
  border:4px solid var(--cielo);
  box-shadow:0 0 0 4px var(--negro), 8px 8px 0 rgba(0,0,0,.5);
  padding:16px 16px 18px; margin:0 0 22px;
}
.card.partA{border-color:var(--cielo)}
.card.partB{border-color:var(--rosa)}
.card.partC{border-color:var(--verde)}
.card.partR{border-color:var(--naranja)}
.card.partX{border-color:var(--amarillo)}
.card .tag{color:var(--amarillo); display:block; margin-bottom:8px}
.card h2{margin:0 0 6px; color:var(--hueso)}
.card h3{margin:16px 0 8px; color:var(--durazno);
  display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.icon{
  display:inline-block; border:2px solid var(--negro); background:var(--negro);
  padding:1px 5px; margin-right:7px; font-size:.95rem; vertical-align:middle;
}
.sub{color:var(--gris); font-size:.86rem; margin:.1rem 0 .9rem}

/* ---------- tablas del libro (vocabulario / patrones) ---------- */
.booktable{
  width:100%; border-collapse:collapse; margin:10px 0 4px; font-size:.86rem;
}
.booktable th,.booktable td{
  border:3px solid var(--negro); padding:7px 9px; text-align:left;
  background:rgba(255,241,232,.07);
}
.booktable th{background:var(--vino); color:var(--amarillo); font-weight:700}
.patternbox{
  border:3px dashed var(--amarillo); background:rgba(255,236,39,.08);
  padding:10px 12px; margin:10px 0;
}
.patternbox p{margin:.25rem 0; font-size:.88rem; color:var(--hueso)}
.patternbox .hl{color:var(--amarillo); font-weight:700}

/* ---------- imagenes del booklet ---------- */
.shot{
  border:4px solid var(--negro); background:var(--hueso);
  padding:6px; margin:12px 0; text-align:center;
}
.shot img{max-width:100%; height:auto; display:block; margin:0 auto}
.shot figcaption{
  color:var(--noche); font-size:.72rem; margin-top:5px; font-weight:700;
}

/* ---------- items ---------- */
.item{
  border-left:4px solid var(--piedra); padding:8px 0 8px 11px; margin:9px 0;
}
.item.done{border-left-color:var(--verde)}
.item.failed{border-left-color:var(--rojo)}
.sline{display:flex; gap:9px; align-items:flex-start; flex-wrap:wrap}
.rn{
  background:var(--lila); color:var(--negro); border:2px solid var(--negro);
  min-width:22px; text-align:center; font-weight:700; font-size:.78rem;
  padding:1px 4px; flex:0 0 auto;
}
.stext{flex:1 1 220px; font-size:.92rem}
.hintword{
  display:inline-block; background:var(--piedra); border:2px solid var(--negro);
  color:var(--amarillo); padding:0 5px; margin-left:6px; font-size:.78rem;
}

/* ---------- inputs ---------- */
input[type=text]{
  font-family:var(--mono); font-size:.9rem; color:var(--negro);
  background:var(--hueso); border:3px solid var(--negro);
  padding:4px 7px; outline:none;
}
input[type=text]:focus{border-color:var(--cielo); background:#fff}
input.w-s{width:130px}
input.w-m{width:210px}
input.w-l{width:100%; margin-top:6px}
input.ok{background:#bdf5c8; border-color:var(--bosque)}
input.no{background:#ffc9d6; border-color:var(--rojo)}
select{
  font-family:var(--mono); font-size:.86rem; color:var(--negro);
  background:var(--hueso); border:3px solid var(--negro); padding:4px 6px;
}
select.ok{background:#bdf5c8; border-color:var(--bosque)}
select.no{background:#ffc9d6; border-color:var(--rojo)}
textarea{
  font-family:var(--mono); font-size:.9rem; color:var(--negro); width:100%;
  background:var(--hueso); border:3px solid var(--negro); padding:7px;
  outline:none; resize:vertical; line-height:1.6;
}
textarea:focus{border-color:var(--cielo)}

/* ---------- botones de opcion ---------- */
.optgroup{display:inline-flex; gap:6px; flex-wrap:wrap; vertical-align:middle}
.pickbtn{
  font-family:var(--mono); font-size:.85rem; cursor:pointer;
  background:var(--piedra); color:var(--hueso); border:3px solid var(--negro);
  box-shadow:3px 3px 0 rgba(0,0,0,.55); padding:3px 9px;
}
.pickbtn:hover{background:var(--lila)}
.pickbtn.on{background:var(--cielo); color:var(--negro)}
.pickbtn.good{background:var(--verde); color:var(--negro)}
.pickbtn.bad{background:var(--rojo); color:var(--hueso)}
.pickbtn[disabled]{cursor:default}

/* ---------- botones ---------- */
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px}
.btn{
  font-family:var(--mono); cursor:pointer; color:var(--negro);
  background:var(--amarillo); border:4px solid var(--negro);
  box-shadow:5px 5px 0 rgba(0,0,0,.6); padding:7px 13px;
  display:inline-flex; align-items:center;
}
.btn:hover{background:var(--naranja)}
.btn:active{transform:translate(2px,2px); box-shadow:3px 3px 0 rgba(0,0,0,.6)}
.btn.ghost{background:var(--piedra); color:var(--hueso)}
.btn.ghost:hover{background:var(--lila); color:var(--negro)}
.btn[disabled]{background:var(--piedra); color:var(--gris); cursor:default;
  box-shadow:none; transform:none}
.scoreline{color:var(--amarillo); font-size:.86rem}

/* ---------- explicaciones ---------- */
.exp{
  border:3px solid var(--bosque); background:rgba(0,228,70,.09);
  padding:9px 11px; margin:9px 0 2px;
}
.exp.wrong{border-color:var(--rojo); background:rgba(255,0,77,.10)}
.exp p{margin:.22rem 0; font-size:.83rem}
.exp .sol{color:var(--amarillo); font-weight:700}
.exp .lab{
  display:inline-block; background:var(--negro); color:var(--amarillo);
  border:2px solid var(--negro); padding:0 5px; margin-right:7px; font-size:.72rem;
}
.exp .lab.tip{color:var(--cielo)}
.explist{margin-top:14px; border-top:3px dashed var(--piedra); padding-top:12px}
.expitem{display:flex; gap:9px; align-items:flex-start; margin-bottom:8px}
.en{
  background:var(--naranja); color:var(--negro); border:2px solid var(--negro);
  min-width:22px; text-align:center; font-weight:700; font-size:.78rem;
  padding:1px 4px; flex:0 0 auto;
}
.expitem .exp{flex:1 1 auto; margin:0}

/* ---------- escritura libre (sin correccion) ---------- */
.freebox{border:3px solid var(--lila); background:rgba(131,118,156,.14); padding:11px 12px; margin:10px 0}
.freebox .fprompt{margin:0 0 8px; font-size:.9rem; color:var(--hueso)}
.freebox .fnote{
  margin:8px 0 0; font-size:.78rem; color:var(--durazno);
  border-top:2px dashed var(--piedra); padding-top:7px;
}
.starter{color:var(--amarillo); font-weight:700; margin-right:6px}
.wordcount{color:var(--gris); font-size:.76rem; margin-top:6px}

/* ---------- autoevaluacion ---------- */
.selftable{width:100%; border-collapse:collapse; margin-top:8px; font-size:.85rem}
.selftable td{border:3px solid var(--negro); padding:7px 9px;
  background:rgba(255,241,232,.07)}
.selftable td.pickcell{width:210px; white-space:nowrap}

/* ---------- la tilde de cierre de cada modulo ---------- */
.finishbox{
  display:flex; gap:10px; align-items:center; margin-top:14px;
  border:3px solid var(--amarillo); background:rgba(255,236,39,.09); padding:10px 12px;
}
.finishbox .tick{color:var(--amarillo); font-weight:700; font-size:1.05rem}

/* ---------- mapa del home ---------- */
.map{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.zone{
  display:block; text-decoration:none; color:var(--hueso);
  background:linear-gradient(180deg,#152046 0%,#0b1230 100%);
  border:4px solid var(--cielo);
  box-shadow:0 0 0 4px var(--negro), 8px 8px 0 rgba(0,0,0,.55);
  padding:14px 15px 16px;
}
.zone:hover{transform:translate(-2px,-2px); box-shadow:0 0 0 4px var(--negro), 11px 11px 0 rgba(0,0,0,.6)}
.zone .znum{color:var(--amarillo); display:block; margin-bottom:8px}
.zone .zt{color:var(--hueso); margin-bottom:9px}
.zone .zd{color:var(--gris); font-size:.83rem; margin:0}
.zone.arcade{border-color:var(--rosa)}
.zone.locked{border-color:var(--piedra); opacity:.75; cursor:default}
.zone.locked .znum{color:var(--gris)}

/* la pantalla de titulo parpadea en steps(), como un arcade */
.press{color:var(--amarillo); text-align:center; margin:22px 0 4px;
  animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.press svg{margin:0 auto}

/* ---------- juegos ---------- */
.gamecard{margin-bottom:26px}
.gmeta{display:flex; gap:12px; flex-wrap:wrap; color:var(--amarillo); font-size:.82rem; margin:8px 0 12px}
.sentence{font-size:1rem; line-height:2.1; margin:10px 0}
.word{
  display:inline-block; cursor:pointer; background:var(--piedra);
  border:3px solid var(--negro); padding:2px 7px; margin:2px 3px;
}
.word:hover{background:var(--lila)}
.word.bad{background:var(--rojo); color:var(--hueso)}
.word.good{background:var(--verde); color:var(--negro)}
.word.dead{cursor:default}
.dots{display:flex; gap:5px; margin:9px 0}
.dot{width:13px; height:13px; background:var(--piedra); border:2px solid var(--negro)}
.dot.y{background:var(--verde)} .dot.n{background:var(--rojo)}
.dot.now{border-color:var(--amarillo)}
.gq{font-size:.96rem; margin:6px 0 10px}
.opts{display:flex; gap:8px; flex-wrap:wrap}
.opt{
  font-family:var(--mono); font-size:.9rem; cursor:pointer; color:var(--negro);
  background:var(--durazno); border:3px solid var(--negro);
  box-shadow:3px 3px 0 rgba(0,0,0,.55); padding:5px 12px;
}
.opt:hover{background:var(--amarillo)}
.opt.good{background:var(--verde)} .opt.bad{background:var(--rojo); color:var(--hueso)}
.opt[disabled]{cursor:default; box-shadow:none}
.fixline{color:var(--amarillo); font-size:.86rem; margin:9px 0 0}
.keyhint{color:var(--gris); font-size:.8rem; margin:8px 0 0}
.final{text-align:center; padding:12px 0}
.final .big{color:var(--amarillo); font-size:2.3rem; font-weight:700; line-height:1.1; margin:8px 0}
.final .msg{color:var(--hueso); font-size:.9rem}
.qbox{border:3px solid var(--lila); padding:11px; margin-top:12px}
.qbox.hidden{display:none}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:270px; margin:10px 0}
.sq{
  aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  background:var(--piedra); border:4px solid var(--negro); cursor:pointer;
  font-size:1.9rem; font-weight:700; color:var(--hueso);
}
.sq.me{background:var(--cielo); color:var(--negro)}
.sq.cpu{background:var(--rosa); color:var(--negro)}
.sq.win{border-color:var(--amarillo)}
.clock{
  font-size:2.1rem; font-weight:700; color:var(--verde);
  border:4px solid var(--negro); background:rgba(0,0,0,.45);
  display:inline-block; padding:2px 14px; min-width:88px; text-align:center;
}
.clock.low{color:var(--rojo)}
.bartrack{height:16px; background:var(--piedra); border:3px solid var(--negro); margin:9px 0}
.barfill{height:100%; background:var(--verde); width:100%}
.wrow{display:flex; gap:5px; margin-bottom:5px}
.tile{
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border:3px solid var(--negro); background:var(--piedra); font-weight:700;
}
.tile.hit{background:var(--verde); color:var(--negro)}
.tile.near{background:var(--amarillo); color:var(--negro)}
.tile.miss{background:var(--vino)}
.flash{font-size:.82rem; color:var(--verde); margin:8px 0 0}
.flash.no{color:var(--rosa)}
.tokens{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0}
.token{
  font-family:var(--mono); font-size:.9rem; cursor:pointer; color:var(--negro);
  background:var(--durazno); border:3px solid var(--negro);
  box-shadow:3px 3px 0 rgba(0,0,0,.55); padding:4px 10px;
}
.token:hover{background:var(--amarillo)}
.token.used{background:var(--piedra); color:var(--gris); cursor:default; box-shadow:none}
.builtline{
  border:3px dashed var(--amarillo); background:rgba(0,0,0,.35);
  min-height:44px; padding:8px 10px; margin:8px 0; font-size:.95rem;
}
.seals{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 0}
.seal{
  border:3px solid var(--negro); background:var(--piedra); color:var(--gris);
  padding:4px 9px; font-size:.78rem;
}
.seal.won{background:var(--amarillo); color:var(--negro)}

/* ---------- navegacion y pie ---------- */
.nav{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 24px}
.nav a{text-decoration:none}
footer.cr{
  border-top:4px solid var(--negro); margin-top:30px; padding:16px 0 22px;
  text-align:center; color:var(--gris); font-size:.8rem;
}
@media (max-width:560px){
  .hero{padding:14px 13px 16px}
  .card{padding:13px 12px 15px}
  input.w-s{width:100px}
  input.w-m{width:150px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<span class="tag" id="heroTag"></span>
<h1 id="heroTitle"></h1>
<p class="goal" id="heroGoal"></p>
</div>
<div class="hud">
<span class="hudlab" id="hudLab"></span>
<div class="segbar" id="hudBar"></div>
<span class="hudscore" id="hudScore"></span>
</div>

var SVGNS = "http://www.w3.org/2000/svg";

/* Dibuja `text` como pixeles. Agrupa los unos contiguos de cada fila en un
   solo <rect> para no llenar el DOM de nodos. */
function pixelText(text, cls){
  text = String(text).toUpperCase();
  var chars = [], i;
  for(i = 0; i < text.length; i++){
    chars.push(GLYPHS[text.charAt(i)] !== undefined ? text.charAt(i) : " ");
  }
  var w = chars.length * 6 - 1;
  if(w < 1) w = 1;
  var svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " 7");
  svg.setAttribute("shape-rendering", "crispEdges");
  svg.setAttribute("preserveAspectRatio", "xMinYMid meet");
  svg.setAttribute("focusable", "false");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", text);
  svg.setAttribute("class", "pxt " + (cls || "pxt-h3"));
  for(i = 0; i < chars.length; i++){
    var rows = GLYPHS[chars[i]].split(",");
    for(var r = 0; r < rows.length; r++){
      var row = rows[r], run = 0;
      for(var c = 0; c <= row.length; c++){
        if(row.charAt(c) === "1"){ run++; continue; }
        if(run > 0){
          var rect = document.createElementNS(SVGNS, "rect");
          rect.setAttribute("x", String(i * 6 + c - run));
          rect.setAttribute("y", String(r));
          rect.setAttribute("width", String(run));
          rect.setAttribute("height", "1");
          svg.appendChild(rect);
          run = 0;
        }
      }
    }
  }
  return svg;
}
function setPixel(node, text, cls){
  while(node.firstChild) node.removeChild(node.firstChild);
  node.appendChild(pixelText(text, cls));
}

/* ===========================================================
   AZAR
   shuffle: Fisher-Yates, el de toda la vida.
   arrange: EL UNICO lugar donde se decide en que orden salen las
   opciones de cualquier ejercicio o juego. Todo lo que muestre
   opciones pasa por aca, y el verificador de azar mide esta misma
   funcion. Devuelve una copia: los datos quedan intactos.
   =========================================================== */
function shuffle(a){
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function arrange(options, correct){
  var idx = [], i;
  for(i = 0; i < options.length; i++) idx.push(i);
  shuffle(idx);
  var opts = [], nuevo = -1;
  for(i = 0; i < idx.length; i++){
    opts.push(options[idx[i]]);
    if(idx[i] === correct) nuevo = i;
  }
  return { options: opts, correct: nuevo };
}

/* ===========================================================
   COMPARACION DE RESPUESTAS
   normalize: minusculas, comillas curvas y el acento agudo pasan a
   apostrofo recto, saca acentos por NFD y puntuacion, conserva el
   apostrofo. loose: ademas saca el apostrofo, asi "dont" o "hasnt"
   pasan como tipeo. A esta edad la falta del apostrofo es un error de
   tecleo, no de gramatica.
   =========================================================== */
function normalize(s){
  return String(s).toLowerCase()
    .replace(/[\u2018\u2019\u02bc\u00b4\u0060]/g, "'")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9' ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function loose(s){ return normalize(s).replace(/'/g, ""); }
function matches(given, list){
  var g = normalize(given);
  if(g === "") return false;
  var gl = loose(given);
  for(var i = 0; i < list.length; i++){
    if(normalize(list[i]) === g) return true;
    if(loose(list[i]) === gl) return true;
  }
  return false;
}

function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt !== undefined && txt !== null) n.textContent = txt;
  return n;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function pixNode(tag, cls, text, pcls){
  var n = el(tag, cls);
  n.appendChild(pixelText(text, pcls));
  return n;
}
function pixBtn(cls, text){
  var b = el("button", cls);
  b.type = "button";
  b.appendChild(pixelText(text, "pxt-btn"));

}

function mkInput(cls, ph){

  i.setAttribute("autocomplete", "off");

/* ---------- choice ---------- */
function renderChoice(st, host, b){
  for(var i = 0; i < b.items.length; i++){
    var d = b.items[i];
    /* El orden se sortea en CADA carga de pagina, sin excepcion. */
    var a = arrange(d.options, d.correct);
    var id = REG.push({ data: d, view: a }) - 1;
    var item = el("div", "item");
    item.setAttribute("data-id", String(id));
    var line = el("div", "sline");
    line.appendChild(el("span", "rn", String(d.n)));
    var txt = el("span", "stext");
    var parts = splitMarks(d.text);
    var group = null, btns = [];
    for(var k = 0; k < parts.length; k++){
      if(k % 2 === 0){
        if(parts[k]) txt.appendChild(document.createTextNode(parts[k]));
      }else{
        group = el("span", "optgroup");
        group.setAttribute("data-sel", "-1");
        for(var j = 0; j < a.options.length; j++){
          var bt = el("button", "pickbtn", a.options[j]);
          bt.type = "button";
          bt.setAttribute("data-opt", String(j));
          bt.addEventListener("click", onPick);
          group.appendChild(bt);
          btns.push(bt);
        }
        txt.appendChild(group);
      }
    }
    line.appendChild(txt);
    item.appendChild(line);
    host.appendChild(item);
    st.entries.push({ kind: "pick", group: group, btns: btns, data: d, view: a, exp: item, item: item });
  }
}
function onPick(ev){
  var b = ev.currentTarget, g = b.parentNode, i;
  var kids = g.querySelectorAll(".pickbtn");
  for(i = 0; i < kids.length; i++) kids[i].classList.remove("on");
  b.classList.add("on");
  g.setAttribute("data-sel", b.getAttribute("data-opt"));
}

/* ---------- match ---------- */
function renderMatch(st, host, b){
  var i, j;
  var lista = el("table", "booktable");
  var hr = el("tr");
  hr.appendChild(el("th", null, b.leftHead));
  hr.appendChild(el("th", null, "Your answer"));
  lista.appendChild(hr);
  for(i = 0; i < b.items.length; i++){
    var d = b.items[i];
    /* cada fila sortea el orden de su propio desplegable */
    var correcta = -1;
    for(j = 0; j < b.endings.length; j++) if(b.endings[j].letter === d.letter) correcta = j;
    var a = arrange(b.endings, correcta);
    var id = REG.push({ data: d, view: a }) - 1;
    var tr = el("tr");
    tr.setAttribute("data-id", String(id));
    var c1 = el("td");

    tr.appendChild(c1);
    var c2 = el("td");
    var sel = document.createElement("select");
    var op0 = document.createElement("option");
    op0.value = ""; op0.textContent = "choose...";
    sel.appendChild(op0);
    for(j = 0; j < a.options.length; j++){
      var op = document.createElement("option");

  for(i = st.entries.length - b.items.length; i < st.entries.length; i++) st.entries[i].panel = panel;

/* ---------- order: armar la oracion tocando las palabras ---------- */
function renderOrder(st, host, b){
  for(var i = 0; i < b.items.length; i++){
    (function(d){
      var id = REG.push({ data: d }) - 1;
      var item = el("div", "item");
      item.setAttribute("data-id", String(id));
      var line = el("div", "sline");
      line.appendChild(el("span", "rn", String(d.n)));
      line.appendChild(el("span", "stext", d.prompt));
      item.appendChild(line);
      var built = el("div", "builtline");
      var bank = el("div", "tokens");
      var chosen = [];
      /* las palabras salen desordenadas en cada carga */
      var words = shuffle(d.words.slice());
      function repaint(){
        clear(built);
        if(!chosen.length){
          built.appendChild(el("span", "keyhint", "Tap the words in the right order."));
        }else{
          built.appendChild(document.createTextNode(chosen.map(function(c){ return c.w; }).join(" ")));
        }
      }
      for(var j = 0; j < words.length; j++){
        (function(w){
          var t = el("button", "token", w);
          t.type = "button";
          t.addEventListener("click", function(){
            if(t.classList.contains("used")){
              for(var z = 0; z < chosen.length; z++){
                if(chosen[z].node === t){ chosen.splice(z, 1); break; }
              }
              t.classList.remove("used");
            }else{
              chosen.push({ w: w, node: t });
              t.classList.add("used");
            }
            repaint();
          });
          bank.appendChild(t);
        })(words[j]);
      }
      repaint();
      item.appendChild(built);
      item.appendChild(bank);
      item.appendChild(el("p", "keyhint", "Tap a word again to take it out."));
      host.appendChild(item);
      st.entries.push({ kind: "order", get: function(){ return chosen.map(function(c){ return c.w; }).join(" "); },
                        data: d, exp: item, item: item });
    })(b.items[i]);
  }
}

function renderPart(key){

  for(i = 0; i < p.blocks.length; i++){
    var b = p.blocks[i];
    blockTitle(st.body, b);
    if(b.type === "vocab")   renderVocab(st.body, b);
    if(b.type === "pattern") renderPattern(st.body, b);
    if(b.type === "image")   renderImage(st.body, b);
    if(b.type === "say")     st.body.appendChild(el("p", "sub", b.text));
    if(b.type === "gap")     renderGap(st, st.body, b);
    if(b.type === "choice")  renderChoice(st, st.body, b);
    if(b.type === "tf")      renderTF(st, st.body, b);
    if(b.type === "match")   renderMatch(st, st.body, b);
    if(b.type === "order")   renderOrder(st, st.body, b);
    if(b.type === "free")    renderFree(st, st.body, b);
    if(b.type === "self")    renderSelf(st, st.body, b);
    if(b.type === "finish")  renderFinish(st, st.body, b);
  }
  if(st.score) st.score.textContent = "";
}

/* La fila de botones y el segmento del HUD se crean UNA sola vez, cuando la
   parte se arma. resetPart vuelve a dibujar el cuerpo, no los botones. */
function addControls(key){
  var st = PT[key];
  if(!st.entries.length) return;
  var row = el("div", "btnrow");
  var checkBtn = pixBtn("btn", "Check");
  var resetBtn = pixBtn("btn ghost", "Try again");
  var score = el("span", "scoreline", "");
  row.appendChild(checkBtn); row.appendChild(resetBtn); row.appendChild(score);
  st.sec.appendChild(row);
  st.score = score;
  checkBtn.addEventListener("click", function(){ checkPart(key); });
  resetBtn.addEventListener("click", function(){ resetPart(key); });
  ORDER.push(key);
  var seg = el("div", "seg");
  hudBar.appendChild(seg);
  segs[key] = seg;
}

/* ===========================================================
   CORRECCION
   =========================================================== */
function markNode(node, ok){
  node.classList.remove("ok", "no");
  node.classList.add(ok ? "ok" : "no");
}
function checkPart(key){
  var st = PT[key], i, j;
  var got = 0, total = 0;

  var old = st.sec.querySelectorAll(".exp");
  for(i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
  for(i = 0; i < st.panels.length; i++){ clear(st.panels[i]); st.panels[i].hidden = true; }

  for(i = 0; i < st.entries.length; i++){
    var e = st.entries[i], allOk = true, answer = null;

    if(e.kind === "input"){
      for(j = 0; j < e.inputs.length; j++){
        var f = e.inputs[j];
        var ok = matches(f.el.value, f.answers);
        markNode(f.el, ok);
        total++;
        if(ok) got++; else allOk = false;
      }
      answer = e.data.solution;
    }
    if(e.kind === "pick"){
      var sel = parseInt(e.group.getAttribute("data-sel"), 10);
      for(j = 0; j < e.btns.length; j++){
        e.btns[j].classList.remove("on", "good", "bad");
        if(j === e.view.correct) e.btns[j].classList.add("good");
        else if(j === sel) e.btns[j].classList.add("bad");
      }
      total++;
      if(sel === e.view.correct) got++; else allOk = false;
      answer = e.view.options[e.view.correct];
    }
    if(e.kind === "match"){
      var okL = e.select.value === e.data.letter;
      markNode(e.select, okL);
      total++;
      if(okL) got++; else allOk = false;
      for(j = 0; j < e.view.options.length; j++){
        if(e.view.options[j].letter === e.data.letter){
          answer = e.data.letter + ")  " + e.view.options[j].text;
        }
      }
    }
    if(e.kind === "order"){
      var mine = e.get();
      var okO = matches(mine, e.data.answers);
      total++;
      if(okO) got++; else allOk = false;
      answer = e.data.solution;
    }

    if(e.item){
      e.item.classList.remove("done", "failed");
      e.item.classList.add(allOk ? "done" : "failed");
    }
    var boxNode = explainBox(allOk, answer, e.data.why, e.data.tip);
    if(e.exp){
      e.exp.appendChild(boxNode);
    }else{
      var wrap = el("div", "expitem");
      wrap.appendChild(el("span", "en", String(e.data.n)));
      wrap.appendChild(boxNode);
      e.panel.appendChild(wrap);
      e.panel.hidden = false;
    }
  }

  st.score.textContent = got + " / " + total + " right";
  st.got = got; st.total = total;
  paintHud();
}
function resetPart(key){
  var st = PT[key];
  renderPart(key);
  st.got = 0; st.total = 0;
  paintHud();
}
function paintHud(){
  var done = 0, all = 0, k;
  for(var i = 0; i < ORDER.length; i++){
    k = ORDER[i];
    var st = PT[k], seg = segs[k];
    seg.className = "seg";
    if(st.total){
      if(st.got === st.total) seg.className = "seg on";
      else seg.className = "seg part";
      done += st.got; all += st.total;
    }
  }
  hudScore.textContent = all ? done + " / " + all + " right so far" : "nothing checked yet";
}

/* ===========================================================
   ARRANQUE
   =========================================================== */
buildParts();
paintHud();

})();
</script>
