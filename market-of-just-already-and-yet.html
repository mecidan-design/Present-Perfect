<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Market of Just, Already and Yet &middot; Present Perfect Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ESTETICA: fantasy heroica (la misma de 03-groups-6-7-8 y del
   resto de la Present Perfect Quest). SIN SONIDO.
   ========================================================= */
:root{
  --gold:#f2b632; --gold-lt:#ffd873; --gold-dk:#9d6d15;
  --night:#120b30; --royal:#5b2ea8; --teal:#0f7a86;
  --crimson:#b1263c; --emerald:#1c7f45;
  --parch:#fdf6e3; --ink:#241605;
  --head:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Poppins","Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); min-height:100vh; padding:24px 14px 0;
  background:
    radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.5px) 0 0/37px 37px,
    radial-gradient(rgba(255,216,115,.45) 1px, transparent 1.4px) 19px 23px/59px 59px,
    radial-gradient(130% 85% at 50% 0%, rgba(255,216,115,.15), transparent 62%),
    linear-gradient(165deg,#0d0827 0%,#221046 26%,#4a1d6e 52%,#123f52 79%,#0a2736 100%);
  background-attachment:fixed;
}
.wrap{max-width:900px;margin:0 auto}
svg.ic{width:1em;height:1em;vertical-align:-.13em;fill:currentColor}

/* ---------- header ---------- */
.hero{
  background:linear-gradient(158deg,#1a0f3d 0%,#3b1a5e 58%,#0f3a4a 100%);
  border:5px solid var(--gold); border-radius:22px;
  box-shadow:0 0 0 4px #150c2f, 13px 13px 0 rgba(0,0,0,.45);
  padding:22px 26px; margin-bottom:26px; position:relative; overflow:hidden;
}
.hero:before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(60% 90% at 82% 15%, rgba(255,216,115,.22), transparent 62%);
  pointer-events:none;
}
.chapter{
  font-family:var(--head); font-weight:700; font-size:.78rem; letter-spacing:3.4px;
  color:var(--gold); text-transform:uppercase; display:block; margin-bottom:5px;
}
.hero h1{
  font-family:var(--head); font-weight:900; color:#fff9e8; margin:0;
  font-size:clamp(1.55rem,5vw,2.6rem); line-height:1.08; letter-spacing:1.4px;
  text-shadow:0 3px 0 #6a3a00, 0 5px 14px rgba(0,0,0,.6);
}
.hero p{font-family:var(--body);color:#d8c7f5;margin:.6rem 0 0;font-size:.97rem;font-weight:500}
.hero .verbline{
  font-family:var(--head); font-weight:700; color:var(--gold-lt); font-size:.84rem;
  letter-spacing:1.5px; margin-top:10px; text-transform:uppercase; line-height:1.6;
}
.homelink{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;
  font-family:var(--head);font-weight:700;font-size:.76rem;letter-spacing:1.6px;text-transform:uppercase;
  color:#1a0f3d;background:linear-gradient(180deg,var(--gold-lt),var(--gold));
  border:3px solid #2b1c07;border-radius:999px;padding:4px 14px;text-decoration:none;
  box-shadow:4px 4px 0 #0a0620;position:relative;
}
.homelink:hover{filter:brightness(1.08)}

/* ---------- quest bar ---------- */
.quest{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px}
.medal{
  flex:1 1 165px; display:flex; align-items:center; gap:10px;
  background:rgba(10,6,28,.72); border:3px solid #4a3a7a; border-radius:16px; padding:9px 13px;
  transition:border-color .2s, background .2s;
}
.medal .mi{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:3px solid #4a3a7a;
  display:flex;align-items:center;justify-content:center;color:#7a6aa8;font-size:1rem;
}
.medal .mt{font-family:var(--head);font-weight:700;font-size:.8rem;letter-spacing:1px;color:#9c8ac8;line-height:1.2}
.medal .ms{font-family:var(--head);font-weight:900;font-size:.95rem;color:#7a6aa8}
.medal.won{border-color:var(--gold);background:rgba(60,36,6,.75)}
.medal.won .mi{border-color:var(--gold);color:var(--gold);background:rgba(242,182,50,.16)}
.medal.won .mt{color:var(--gold-lt)}
.medal.won .ms{color:#fff9e8}

/* ---------- cards ---------- */
.card{
  background:
    radial-gradient(rgba(150,110,40,.075) 1px, transparent 1.6px) 0 0/13px 13px,
    linear-gradient(180deg,#fdf6e3 0%,#f6e9cd 100%);
  border:4px solid #2b1c07; border-radius:18px; padding:22px 22px 24px;
  margin-bottom:34px; position:relative;
}
.card:nth-of-type(3n+1){box-shadow:10px 10px 0 var(--gold-dk); transform:rotate(-.4deg)}
.card:nth-of-type(3n+2){box-shadow:10px 10px 0 var(--crimson); transform:rotate(.35deg)}
.card:nth-of-type(3n+3){box-shadow:10px 10px 0 var(--teal);    transform:rotate(-.25deg)}
/* OJO (trampa del SPECS): cualquier variante necesita DOS clases,
   porque :nth-of-type le gana por especificidad a una clase sola. */
.card.codex{
  background:linear-gradient(180deg,#1a0f3d,#12283a);
  border-color:var(--gold); box-shadow:10px 10px 0 rgba(0,0,0,.42); transform:rotate(.3deg);
}
.tag{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--head); font-weight:700; font-size:.75rem; letter-spacing:2px;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold)); color:#2b1c07;
  border:3px solid #2b1c07; border-radius:999px;
  padding:3px 14px; margin-bottom:11px; text-transform:uppercase;
}
.card h2{font-family:var(--head);font-weight:900;font-size:1.5rem;margin:.1rem 0 .3rem;line-height:1.15;letter-spacing:.6px}
.sub{font-size:.92rem;color:#5c4a2c;margin:0 0 18px;line-height:1.5}
.codex h2{color:#fff9e8}
.codex .sub{color:#c9bbe8}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--head); font-weight:700; font-size:.97rem; letter-spacing:.7px;
  color:#2b1c07; cursor:pointer;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));
  border:3px solid #2b1c07; border-radius:999px; padding:10px 24px;
  box-shadow:5px 5px 0 #2b1c07; transition:transform .07s, box-shadow .07s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 #2b1c07}
.btn.ghost{background:var(--parch);color:#2b1c07}
.btn.dark{background:linear-gradient(180deg,#3b1a5e,#1a0f3d);color:#ffe9b0;border-color:var(--gold);box-shadow:5px 5px 0 #0a0620}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}
.scoreline{font-family:var(--head);font-weight:700;font-size:1rem;letter-spacing:.5px}

/* ---------- inputs ---------- */
input[type=text],select{
  font-family:var(--body); font-size:1rem; font-weight:500; padding:7px 11px;
  border:3px solid #2b1c07; border-radius:10px; background:#fffdf4; outline:none; color:var(--ink);
}
input[type=text]:focus,select:focus{background:#fff;box-shadow:0 0 0 4px var(--gold)}
input.ok,select.ok{background:#e3f7e0;border-color:var(--emerald)}
input.no,select.no{background:#fde5e9;border-color:var(--crimson)}
input.w-s{width:150px}
input.w-l{width:100%}

/* ---------- explanation blocks ---------- */
.exp{
  border:3px solid #2b1c07;border-radius:13px;padding:11px 13px;margin-top:11px;
  background:#f3ecfb;font-size:.92rem;line-height:1.5;
}
.exp.right{background:#eaf8e5}
.exp.wrong{background:#fdeef1}
.exp b.lab{
  font-family:var(--head);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;
  display:inline-block;border:2px solid #2b1c07;border-radius:999px;padding:1px 10px;margin-right:7px;
}
.lab.why{background:#a8e4ec}
.lab.tip{background:var(--gold-lt)}
.exp p{margin:0 0 7px}
.exp p:last-child{margin-bottom:0}
/* OJO: Cinzel dibuja las minusculas como VERSALITAS. Sirve para titulos y
   etiquetas, pero destruye la lectura de una oracion completa. Todo lo que el
   alumno tenga que LEER como ingles corriente va con la tipografia de cuerpo. */
.sol{font-family:var(--body);font-weight:700;color:#3d1470}

/* ---------- grammar note ---------- */
.gnote{
  border:4px solid #2b1c07;border-radius:15px;padding:13px 16px;margin:0 0 18px;
  background:linear-gradient(180deg,#fffaea,#fbf0d2);box-shadow:5px 5px 0 var(--gold);
  font-size:.95rem;line-height:1.6;
}
.gnotetitle{font-family:var(--head);font-weight:900;font-size:1.02rem;display:flex;align-items:center;gap:8px;margin-bottom:8px;letter-spacing:.5px}
.gnote ul{margin:0;padding-left:20px}
.gnote li{margin-bottom:6px}
.gform{
  font-family:var(--body);font-weight:600;background:#a8e4ec;
  border:2px solid #2b1c07;border-radius:6px;padding:1px 7px;display:inline-block;
}
.gwarn{margin:10px 0 0;background:#fde5e9;border:2px solid #2b1c07;border-radius:10px;padding:8px 11px;font-weight:500}

/* ---------- word box ---------- */
.vaultbox{
  border:4px dashed #2b1c07;border-radius:16px;padding:13px 15px;margin-bottom:20px;
  background:linear-gradient(180deg,#fffaea,#f7ecd2);
}
.vaultbox .vt{font-family:var(--head);font-weight:900;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:#8a6a2a;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{
  font-family:var(--head);font-weight:700;font-size:.88rem;letter-spacing:1.5px;
  background:#fff;border:3px solid #2b1c07;border-radius:9px;padding:4px 12px;box-shadow:3px 3px 0 var(--gold);
}
.vchip.used{background:#e3f7e0;box-shadow:3px 3px 0 var(--emerald);opacity:.62;text-decoration:line-through}
.vchip.done{background:#e7e2f5;box-shadow:3px 3px 0 var(--royal);opacity:.62;text-decoration:line-through}

/* ---------- items ---------- */
.item{border:3px solid #2b1c07;border-radius:15px;padding:14px 15px;margin-bottom:16px;background:#fffdf4}
.item.model{border-style:dashed;background:#eaf8e5}
.sline{display:flex;align-items:flex-start;gap:9px;font-size:1.04rem;font-weight:500;line-height:2.1}
.rn{
  font-family:var(--head);font-size:.74rem;font-weight:700;color:#fff9e8;background:var(--royal);
  border:2px solid #2b1c07;border-radius:50%;width:22px;height:22px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;margin-top:8px;
}
.rn.zero{background:var(--emerald)}
.prompt{display:flex;align-items:flex-start;gap:9px;font-size:1.04rem;font-weight:600;line-height:1.5;margin:0 0 10px}
.prompt .wrong{text-decoration:line-through;text-decoration-color:var(--crimson);text-decoration-thickness:2px}
.donetext{font-family:var(--body);font-weight:700;color:#1c7f45}
.exampletag{
  font-family:var(--head);font-weight:700;font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase;
  background:#bdf0b0;border:2px solid #2b1c07;border-radius:999px;padding:1px 10px;margin-left:8px;
  display:inline-block;vertical-align:2px;
}
.hintword{
  font-family:var(--head);font-weight:700;font-size:.74rem;letter-spacing:1.4px;text-transform:uppercase;
  background:var(--gold-lt);border:2px solid #2b1c07;border-radius:999px;padding:1px 10px;margin-left:8px;
  display:inline-block;vertical-align:2px;
}
.matchrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px}
.matchrow .mlab{font-family:var(--head);font-weight:700;font-size:.74rem;letter-spacing:1.4px;text-transform:uppercase;border:2px solid #2b1c07;border-radius:999px;padding:2px 12px;background:#a8e4ec}

/* ---------- conversation (underline the option) ---------- */
.conv{border:3px solid #2b1c07;border-radius:15px;padding:14px 15px;background:#fffdf4}
.convline{display:flex;gap:10px;margin-bottom:9px;line-height:1.9;font-size:1.02rem}
.convline .who{font-family:var(--head);font-weight:900;letter-spacing:.6px;flex:0 0 4.4rem;color:#3d1470}
.optgroup{display:inline-flex;flex-wrap:wrap;gap:5px;vertical-align:-3px;margin:0 3px}
.optgroup .gn{
  font-family:var(--head);font-weight:900;font-size:.7rem;color:#fff9e8;background:var(--royal);
  border:2px solid #2b1c07;border-radius:50%;width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;align-self:center;
}
.pickbtn{
  font-family:var(--body);font-size:.95rem;font-weight:600;cursor:pointer;background:#fff;
  border:2px solid #2b1c07;border-radius:8px;padding:2px 9px;color:var(--ink);
}
.pickbtn:hover{background:#fff3d0}
.pickbtn.on{background:var(--gold-lt);text-decoration:underline;text-decoration-thickness:3px}
.pickbtn.good{background:#bdf0b0;border-color:var(--emerald)}
.pickbtn.bad{background:#ffc7d1;border-color:var(--crimson);text-decoration:line-through}

/* ---------- running text with gaps (cloze) ---------- */
.clozetext{border:3px solid #2b1c07;border-radius:15px;padding:14px 16px;background:#fffdf4;font-size:1.02rem;line-height:2.4}
.clozetext .gn{
  font-family:var(--head);font-weight:900;font-size:.7rem;color:#fff9e8;background:var(--royal);
  border:2px solid #2b1c07;border-radius:50%;width:19px;height:19px;margin-right:4px;
  display:inline-flex;align-items:center;justify-content:center;vertical-align:1px;
}
.clozetext input{width:130px}

/* ---------- panel de explicaciones para huecos inline ---------- */
/* REGLA DE LAYOUT DEL SPECS: si los huecos estan dentro de un texto corrido,
   la explicacion NO va pegada a cada input (rompe la lectura del parrafo).
   Van todas juntas, numeradas, en un panel debajo del texto completo. */
.explist{margin-top:16px}
.explist h3{font-family:var(--head);font-weight:900;font-size:1rem;letter-spacing:1px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.expitem{display:flex;gap:10px;margin-bottom:10px}
.expitem .en{
  font-family:var(--head);font-size:.74rem;font-weight:700;color:#fff9e8;background:var(--royal);
  border:2px solid #2b1c07;border-radius:50%;width:22px;height:22px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;margin-top:9px;
}
.expitem .exp{flex:1;margin-top:0}

/* ---------- CODEX ---------- */
.gbox{border:3px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,.05)}
.gbox h4{font-family:var(--head);font-weight:900;font-size:.92rem;letter-spacing:1.6px;color:var(--gold-lt);margin:0 0 4px;text-transform:uppercase}
.gbox .pat{font-size:.84rem;color:#c9bbe8;margin:0 0 9px}
.pairs{display:flex;flex-wrap:wrap;gap:7px}
.pchip{font-family:var(--head);font-weight:700;font-size:.85rem;letter-spacing:.8px;background:var(--parch);border:2px solid #2b1c07;border-radius:8px;padding:3px 11px;color:var(--ink)}
.pchip b{color:#8f1230}
.hidden{display:none}

/* ---------- pie ---------- */
footer.site{
  margin-top:10px;padding:20px 14px 26px;text-align:center;
  font-family:var(--head);font-weight:700;font-size:.74rem;letter-spacing:2.2px;
  text-transform:uppercase;color:#9c8ac8;
}

/* ---------- boton de vuelta al pie de la pagina ---------- */
.bottomnav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:4px 0 32px}
a.btnlink{
  text-decoration:none;display:inline-flex;align-items:center;gap:.5em;
  font-family:var(--head);font-weight:700;font-size:.95rem;letter-spacing:.7px;color:#2b1c07;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));
  border:3px solid #2b1c07;border-radius:999px;padding:10px 24px;
  box-shadow:5px 5px 0 #2b1c07;transition:transform .07s, box-shadow .07s;
}
a.btnlink:hover{filter:brightness(1.07)}
a.btnlink:active{transform:translate(5px,5px);box-shadow:0 0 0 #2b1c07}
</style>
</head>

  <div class="hero">
    <span class="chapter" id="heroChapter"></span>

</div>

<script id="data-block">
/* ============================================================
   SOLO CONTENIDO. Ni una referencia al DOM en este bloque.
   ============================================================
   PREPARE SECOND EDITION LEVEL 3 - UNIT 14 GRAMMAR: PLUS.
   Insumo unico: la hoja fotocopiable que mando el profesor.
   Estan los ejercicios 1, 2, 3, 4 y 6. El 5 es de PRONUNCIATION
   (entonacion de preguntas y afirmaciones, audio 08) y se saco a
   pedido del profesor: necesita el audio, no se puede resolver
   ni autocorregir en pantalla.

   El item 1 de cada ejercicio viene resuelto en la hoja, asi que
   aca aparece como ejemplo y no suma puntos, igual que en el papel.

   >>> DOS AVISOS PARA EL PROFESOR <<<
   1) Ejercicio 2 numero 2 y ejercicio 4 numero 5: la hoja da el
      verbo GO, y con el present perfect conviven been y gone
      ("We haven't been to the new bookshop yet" es lo que suena
      natural; "gone" sale de la palabra que da la consigna).
      El corrector ACEPTA LAS DOS y lo explica en el Hero tip.
      Si la clave del libro pide una sola, se corrige el array
      "answers" de esos dos items y nada mas.
   2) Ejercicio 6 hueco 6 ("I think I ___ go to the new bookshop"):
      la respuesta del libro es will, pero might y may tambien
      funcionan. El corrector las acepta y muestra will como
      respuesta modelo.
   ============================================================ */
var DATA = {

meta: {
  chapter: "Unit 14 · Stop III",
  title: "The Market of Just, Already and Yet",
  sub: "Three new words have arrived at the market. just is for something that happened a moment ago, already is for something finished sooner than anybody expected, and yet lives in negatives and questions.",
  verbs: "just &middot; already &middot; yet &middot; have / has + past participle"
},

trials: [

/* ---------- Ejercicio 1 ---------- */
{
  key: "t1", icon: "star",
  medal: "Brackets",
  title: "The Word in Brackets",
  sub: "Rewrite the sentences using the word in brackets. Number 1 is done for you.",
  type: "write",
  note: {
    title: "Where the three words go",
    lines: [
      "just -> between have/has and the past participle: has just paid.",
      "already -> in the same place: have already played.",
      "yet -> at the very end of the sentence, and only in negatives and questions: ... yet?"
    ],
    warning: "Do not change anything else. Only put the new word in its place."
  },
  example: { n: 1, prompt: "My parents have opened a bakery in the old town. (just)", gap: "My parents have just opened a bakery in the old town." },
  items: [
    { n: 2, prompt: "We've done this exercise three times!", keyword: "already",
      answers: ["we've already done this exercise three times","we have already done this exercise three times"],
      solution: "We've already done this exercise three times!",
      why: "already goes between the auxiliary and the past participle, so it slides in between We've and done.",
      tip: "already says the action is finished, and often earlier than people expected." },
    { n: 3, prompt: "Have you been to the new department store?", keyword: "yet",
      answers: ["have you been to the new department store yet"],
      solution: "Have you been to the new department store yet?",
      why: "yet is different from the other two: it goes at the end of the sentence, and this is a question, which is where yet belongs.",
      tip: "In a question, yet means 'up to now'. It is always the last word before the question mark." },
    { n: 4, prompt: "I haven't bought Mum's birthday present.", keyword: "yet",
      answers: ["i haven't bought mum's birthday present yet","i have not bought mum's birthday present yet"],
      solution: "I haven't bought Mum's birthday present yet.",
      why: "The sentence is negative, and yet goes at the end: it means the present is still not bought.",
      tip: "yet only works in negatives and questions. In a positive sentence you use already." },
    { n: 5, prompt: "Sam has paid for our snacks so don't worry.", keyword: "just",
      answers: ["sam has just paid for our snacks so don't worry","sam's just paid for our snacks so don't worry"],
      solution: "Sam has just paid for our snacks so don't worry.",
      why: "just goes straight after has, before the past participle paid.",
      tip: "just means 'a very short time ago'. It never goes at the end of the sentence." },
    { n: 6, prompt: "My brothers have played golf several times this week.", keyword: "already",
      answers: ["my brothers have already played golf several times this week","my brothers've already played golf several times this week"],
      solution: "My brothers have already played golf several times this week.",
      why: "already goes between have and played, and the rest of the sentence does not move.",

    { n: 7, prompt: "I've told him how to get to the supermarket.", keyword: "just",

<script id="engine-block">
(function(){
"use strict";

/* ===== registry: el DOM guarda SOLO un indice numerico. Serializar JSON en
   un atributo data-* se rompe con los apostrofes de las contracciones. ===== */
var REG = [];

/* ===== iconos svg estaticos (decorativos) ===== */
var ICONS = {
  shield: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 2 20.5 5v6.2c0 5.2-3.6 9.2-8.5 10.8C7.1 20.4 3.5 16.4 3.5 11.2V5z"/></svg>',
  sword:  '<svg class="ic" viewBox="0 0 24 24"><path d="M12 1.5l2.2 3.6v9.4h-4.4V5.1z"/><rect x="6" y="14.6" width="12" height="2.4" rx="1.2"/><rect x="10.8" y="17.2" width="2.4" height="3.6" rx="1.2"/><rect x="9.4" y="20.2" width="5.2" height="2" rx="1"/></svg>',
  scroll: '<svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M6 2h11a2.5 2.5 0 0 1 2.5 2.5V18a4 4 0 0 0 4 4H8a4 4 0 0 1-4-4V4.5A2.5 2.5 0 0 1 6 2zm2 5h9v2H8zm0 4h9v2H8zm0 4h6v2H8z"/></svg>',
  star:   '<svg class="ic" viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>',
  crown:  '<svg class="ic" viewBox="0 0 24 24"><path d="M3 7.5l4 3.2L12 4l5 6.7 4-3.2-1.9 11.3H4.9z"/></svg>',
  bolt:   '<svg class="ic" viewBox="0 0 24 24"><path d="M13 2 4 13.5h6L11 22l9-11.5h-6z"/></svg>',
  flame:  '<svg class="ic" viewBox="0 0 24 24"><path d="M12 2c3.2 4.2 6.2 5.6 6.2 9.8A6.2 6.2 0 0 1 5.8 12c0-2.2 1.1-3.7 2.3-4.9.3 1.4 1 2.1 1.9 2.4C10.3 7.2 11 4.6 12 2z"/></svg>'
};
function icon(name){
  var s = document.createElement("span");
  s.innerHTML = ICONS[name] || "";
  return s.firstChild;
}

/* ===== helpers ===== */
function normalize(s){
  /* normalize("NFD") separa la tilde de la letra y la clase ̀-ͯ la
     borra: asi "cafe" y "cafe" con tilde comparan igual. */
  return String(s).toLowerCase()
    .replace(/[‘’ʼ]/g, "'")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9' ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
/* ADAPTACION A PRIMARIA (se aparta a proposito del normalize del SPECS):
   a esta edad "havent" o "dont" sin apostrofe son un error de TIPEO, no de
   gramatica, y lo que se evalua es la estructura. Por eso la comparacion
   tambien se hace ciega al apostrofe. Esto NO afloja la gramatica:
   "have never grew" sigue estando mal. */
function loose(s){ return normalize(s).replace(/'/g, ""); }
function matches(given, list){
  var g = normalize(given);
  if(g === "") return false;
  var gl = loose(given);
  for(var i = 0; i < list.length; i++){
    if(normalize(list[i]) === g) return true;
    if(loose(list[i]) === gl) return true;
  }
  return false;
}
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt !== undefined && txt !== null) n.textContent = txt;
  return n;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

/* Caja Why + Hero tip. Se muestra SIEMPRE, este bien o mal. */
function explainBox(ok, answerText, why, tip){
  var box = el("div", "exp " + (ok ? "right" : "wrong"));
  if(answerText){
    var p0 = el("p");
    p0.appendChild(el("span", "sol", "Answer: " + answerText));
    box.appendChild(p0);
  }
  var p1 = el("p");
  p1.appendChild(el("b", "lab why", "Why"));
  p1.appendChild(document.createTextNode(why));
  box.appendChild(p1);
  var p2 = el("p");
  p2.appendChild(el("b", "lab tip", "Hero tip"));
  p2.appendChild(document.createTextNode(tip));
  box.appendChild(p2);
  return box;
}
/* Caja de gramatica al estilo de las del manual. Cada linea usa " -> ". */
function noteBox(n){
  var g = el("div", "gnote");
  var t = el("div", "gnotetitle");
  t.appendChild(icon("scroll"));
  t.appendChild(document.createTextNode(" " + n.title));
  g.appendChild(t);
  var ul = document.createElement("ul");
  for(var i = 0; i < n.lines.length; i++){
    var parts = n.lines[i].split(" -> ");
    var li = document.createElement("li");
    li.appendChild(el("span", "gform", parts[0]));
    if(parts.length > 1) li.appendChild(document.createTextNode(" " + parts[1]));
    ul.appendChild(li);
  }
  g.appendChild(ul);
  if(n.warning) g.appendChild(el("p", "gwarn", n.warning));
  return g;
}
function mkInput(cls, ph){
  var i = document.createElement("input");
  i.type = "text";
  if(cls) i.className = cls;
  i.setAttribute("autocomplete", "off");
  i.setAttribute("autocapitalize", "off");
  i.setAttribute("spellcheck", "false");
  if(ph) i.setAttribute("placeholder", ph);
  return i;
}
/* Corta un texto por los marcadores {1}, {2}... y devuelve los trozos.
   Los indices impares del array son el numero del hueco. */
function splitMarks(text){ return String(text).split(/\{(\d+)\}/); }

/* ============================================================
   CABECERA + BARRA DE MEDALLAS
   ============================================================ */
document.title = DATA.meta.title + " - " + DATA.meta.chapter;
document.getElementById("heroChapter").textContent = DATA.meta.chapter;
document.getElementById("heroTitle").textContent = DATA.meta.title;
document.getElementById("heroSub").textContent = DATA.meta.sub;
document.getElementById("heroVerbs").innerHTML = DATA.meta.verbs;

var questBar = document.getElementById("questBar");
var questEls = {};
(function(){
  for(var i = 0; i < DATA.trials.length; i++){
    var t = DATA.trials[i];
    var d = el("div", "medal");
    var mi = el("div", "mi");
    mi.appendChild(icon(t.icon));
    var txt = el("div");
    txt.appendChild(el("div", "mt", t.medal));
    var sc = el("div", "ms", "not tried yet");
    txt.appendChild(sc);
    d.appendChild(mi);
    d.appendChild(txt);
    questBar.appendChild(d);
    questEls[t.key] = { wrap: d, score: sc };
  }
})();
function setQuest(key, got, total){
  var q = questEls[key];
  q.score.textContent = got + " / " + total;
  if(got === total) q.wrap.classList.add("won");
  else q.wrap.classList.remove("won");
}
function resetQuest(key){
  questEls[key].score.textContent = "not tried yet";
  questEls[key].wrap.classList.remove("won");
}

/* ============================================================
   CONSTRUCCION DE LOS TRIALS
   Cada trial declara su type y el motor arma el bloque:
     gap    -> oracion suelta con un hueco corto adentro
     write  -> consigna arriba + una linea entera para escribir
     match  -> forma del verbo + letra a elegir (dos puntos por item)
     choice -> conversacion con opciones para marcar
     cloze  -> texto corrido con huecos numerados
   En gap / write / match la explicacion va PEGADA al item.
   En choice / cloze va en un panel numerado debajo del texto, porque
   pegada a cada hueco rompe la lectura del parrafo (regla del SPECS).
   ============================================================ */
var ROMAN = ["I","II","III","IV","V","VI","VII"];
var trialsHost = document.getElementById("trials");
var TR = {};

function buildTrials(){
  for(var i = 0; i < DATA.trials.length; i++){
    var t = DATA.trials[i];
    var sec = el("section", "card");
    sec.appendChild(el("span", "tag", "Trial " + ROMAN[i]));
    sec.appendChild(el("h2", null, t.title));
    sec.appendChild(el("p", "sub", t.sub));
    if(t.note) sec.appendChild(noteBox(t.note));

    var chips = null;
    if(t.box){
      var vb = el("div", "vaultbox");
      var vt = el("div", "vt");
      vt.appendChild(icon("scroll"));
      vt.appendChild(document.createTextNode(" Verb box"));
      vb.appendChild(vt);
      chips = el("div", "vchips");
      vb.appendChild(chips);
      sec.appendChild(vb);
    }

    var body = el("div", "tbody");
    sec.appendChild(body);

    var panel = null;
    if(t.type === "choice" || t.type === "cloze"){
      panel = el("div", "explist");
      var h = el("h3");
      h.appendChild(icon("scroll"));
      h.appendChild(document.createTextNode(" Why each answer is right"));
      panel.appendChild(h);
      panel.hidden = true;
      sec.appendChild(panel);
    }

    var row = el("div", "btnrow");
    var checkBtn = el("button", "btn", "Check my answers");
    checkBtn.type = "button";
    var resetBtn = el("button", "btn ghost", "Try again");
    resetBtn.type = "button";
    var score = el("span", "scoreline", "");
    row.appendChild(checkBtn); row.appendChild(resetBtn); row.appendChild(score);
    sec.appendChild(row);

    trialsHost.appendChild(sec);

    TR[t.key] = { data: t, body: body, chips: chips, panel: panel, score: score, entries: [] };
    (function(key){
      checkBtn.addEventListener("click", function(){ checkTrial(key); });
      resetBtn.addEventListener("click", function(){ resetTrial(key); });
    })(t.key);

    renderTrial(t.key);
  }
}

function renderTrial(key){
  var st = TR[key], t = st.data, i;
  clear(st.body);
  st.entries = [];
  if(st.panel){
    while(st.panel.childNodes.length > 1) st.panel.removeChild(st.panel.lastChild);
    st.panel.hidden = true;
  }
  if(st.chips){
    clear(st.chips);
    for(i = 0; i < t.box.length; i++){
      var chip = el("span", "vchip", t.box[i]);
      if(t.box[i] === t.boxUsedInExample) chip.className = "vchip done";
      st.chips.appendChild(chip);
    }
  }
  st.score.textContent = "";

  if(t.type === "gap")    renderGap(st, t);
  if(t.type === "write")  renderWrite(st, t);
  if(t.type === "match")  renderMatch(st, t);
  if(t.type === "choice") renderChoice(st, t);
  if(t.type === "cloze")  renderCloze(st, t);
}

/* ---------- gap ---------- */
function renderGap(st, t){
  var i;
  if(t.example){
    var m = el("div", "item model");
    var l = el("div", "sline");
    l.appendChild(el("span", "rn zero", String(t.example.n)));
    var s = el("span");
    s.appendChild(document.createTextNode(t.example.before + " "));
    s.appendChild(el("span", "donetext", t.example.gap));
    s.appendChild(document.createTextNode(" " + t.example.after));
    s.appendChild(el("span", "exampletag", "example"));
    l.appendChild(s);
    m.appendChild(l);
    st.body.appendChild(m);
  }
  for(i = 0; i < t.items.length; i++){
    var d = t.items[i];
    var id = REG.push({ data: d }) - 1;
    var item = el("div", "item");
    item.setAttribute("data-id", String(id));
    var line = el("div", "sline");
    line.appendChild(el("span", "rn", String(d.n)));
    var txt = el("span");
    txt.appendChild(document.createTextNode(d.before + " "));
    var inp = mkInput("w-s");
    txt.appendChild(inp);
    txt.appendChild(document.createTextNode(" " + d.after));
    if(d.verb) txt.appendChild(el("span", "hintword", d.verb));
    line.appendChild(txt);
    item.appendChild(line);
    st.body.appendChild(item);
    st.entries.push({ kind: "input", inputs: [{ el: inp, answers: d.answers }], data: d, holder: item, exp: item });
  }
}

/* ---------- write ---------- */
function renderWrite(st, t){
  var i;
  if(t.example){
    var m = el("div", "item model");
    var p = el("p", "prompt");
    p.appendChild(el("span", "rn zero", String(t.example.n)));
    var sp = el("span");
    sp.appendChild(document.createTextNode(t.example.prompt));
    sp.appendChild(el("span", "exampletag", "example"));
    p.appendChild(sp);
    m.appendChild(p);
    m.appendChild(el("p", "donetext", t.example.gap));
    st.body.appendChild(m);
  }
  for(i = 0; i < t.items.length; i++){
    var d = t.items[i];
    var id = REG.push({ data: d }) - 1;
    var item = el("div", "item");
    item.setAttribute("data-id", String(id));
    var pr = el("p", "prompt");
    pr.appendChild(el("span", "rn", String(d.n)));
    var sp2 = el("span");
    sp2.appendChild(document.createTextNode(d.prompt));
    if(d.keyword) sp2.appendChild(el("span", "hintword", d.keyword));
    pr.appendChild(sp2);
    item.appendChild(pr);
    var inp = mkInput("w-l", "Write the whole sentence here.");
    item.appendChild(inp);
    st.body.appendChild(item);
    st.entries.push({ kind: "input", inputs: [{ el: inp, answers: d.answers }], data: d, holder: item, exp: item });
  }
}

/* ---------- match ---------- */
function renderMatch(st, t){
  var i, j;
  if(t.example){
    var m = el("div", "item model");
    var l = el("div", "sline");
    l.appendChild(el("span", "rn zero", String(t.example.n)));
    var s = el("span");
    s.appendChild(document.createTextNode(t.example.before + " "));
    s.appendChild(el("span", "donetext", t.example.gap));
    s.appendChild(document.createTextNode(" " + t.example.after + "  →  " + t.example.letter));
    s.appendChild(el("span", "exampletag", "example"));
    l.appendChild(s);
    m.appendChild(l);
    st.body.appendChild(m);
  }
  for(i = 0; i < t.items.length; i++){
    var d = t.items[i];
    var id = REG.push({ data: d }) - 1;
    var item = el("div", "item");
    item.setAttribute("data-id", String(id));
    var line = el("div", "sline");
    line.appendChild(el("span", "rn", String(d.n)));
    var txt = el("span");
    txt.appendChild(document.createTextNode(d.before + " "));
    var inp = mkInput("w-s");
    txt.appendChild(inp);
    txt.appendChild(el("span", "hintword", d.verb));
    line.appendChild(txt);
    item.appendChild(line);

    var row = el("div", "matchrow");
    row.appendChild(el("span", "mlab", "Ending"));
    var sel = document.createElement("select");
    var op0 = document.createElement("option");
    op0.value = ""; op0.textContent = "choose...";
    sel.appendChild(op0);
    for(j = 0; j < t.endings.length; j++){
      var op = document.createElement("option");
      op.value = t.endings[j].letter;
      op.textContent = t.endings[j].letter + "  " + t.endings[j].text;
      sel.appendChild(op);
    }
    row.appendChild(sel);
    item.appendChild(row);
    st.body.appendChild(item);

    st.entries.push({ kind: "match", inputs: [{ el: inp, answers: d.answers }], select: sel, data: d, holder: item, exp: item });
  }
}

/* ---------- choice ---------- */
function renderChoice(st, t){
  var conv = el("div", "conv");
  var byNum = {};
  var i, k;
  for(i = 0; i < t.items.length; i++) byNum[t.items[i].n] = t.items[i];
  var exNum = t.example ? t.example.n : -1;

  for(i = 0; i < t.lines.length; i++){
    var ln = t.lines[i];
    var row = el("div", "convline");
    row.appendChild(el("span", "who", ln.who + ":"));
    var said = el("span", "said");
    var parts = splitMarks(ln.text);
    for(k = 0; k < parts.length; k++){
      if(k % 2 === 0){
        if(parts[k] !== "") said.appendChild(document.createTextNode(parts[k]));
      }else{
        var n = parseInt(parts[k], 10);
        said.appendChild(n === exNum ? exampleGroup(t.example) : pickGroup(st, byNum[n]));
      }
    }
    row.appendChild(said);
    conv.appendChild(row);
  }
  st.body.appendChild(conv);
}
function exampleGroup(ex){
  var g = el("span", "optgroup");
  g.appendChild(el("span", "gn", String(ex.n)));
  for(var j = 0; j < ex.options.length; j++){
    var b = el("span", "pickbtn" + (j === ex.correct ? " good" : ""), ex.options[j]);
    g.appendChild(b);
  }
  return g;
}
function pickGroup(st, d){
  var id = REG.push({ data: d }) - 1;
  var g = el("span", "optgroup");
  g.setAttribute("data-id", String(id));
  g.setAttribute("data-sel", "-1");
  g.appendChild(el("span", "gn", String(d.n)));
  var btns = [];
  for(var j = 0; j < d.options.length; j++){
    var b = el("button", "pickbtn", d.options[j]);
    b.type = "button";
    b.setAttribute("data-opt", String(j));
    b.addEventListener("click", onPick);
    g.appendChild(b);
    btns.push(b);
  }
  st.entries.push({ kind: "pick", group: g, btns: btns, data: d, holder: g, exp: null });
  return g;
}
function onPick(ev){
  var b = ev.currentTarget, g = b.parentNode, i;
  var kids = g.querySelectorAll(".pickbtn");
  for(i = 0; i < kids.length; i++) kids[i].classList.remove("on");
  b.classList.add("on");
  g.setAttribute("data-sel", b.getAttribute("data-opt"));
}

/* ---------- cloze ---------- */
function renderCloze(st, t){
  var box = el("div", "clozetext");
  var byNum = {}, i, k;
  for(i = 0; i < t.items.length; i++) byNum[t.items[i].n] = t.items[i];
  var parts = splitMarks(t.text);
  for(k = 0; k < parts.length; k++){
    if(k % 2 === 0){
      if(parts[k] !== "") box.appendChild(document.createTextNode(parts[k]));
    }else{
      var n = parseInt(parts[k], 10);
      box.appendChild(el("span", "gn", String(n)));
      if(t.example && n === t.example.n){
        box.appendChild(el("span", "donetext", t.example.gap));
      }else{
        var d = byNum[n];
        var id = REG.push({ data: d }) - 1;
        var inp = mkInput("");
        inp.setAttribute("data-id", String(id));
        box.appendChild(inp);
        st.entries.push({ kind: "input", inputs: [{ el: inp, answers: d.answers }], data: d, holder: inp, exp: null });
      }
    }
  }
  st.body.appendChild(box);
}

/* ============================================================
   CORRECCION
   ============================================================ */
function markInput(node, ok){
  node.classList.remove("ok", "no");
  node.classList.add(ok ? "ok" : "no");
}
function checkTrial(key){
  var st = TR[key], t = st.data, i, j;
  var got = 0, total = 0;

  /* limpiar explicaciones anteriores */
  var old = st.body.querySelectorAll(".exp");
  for(i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
  if(st.panel){
    while(st.panel.childNodes.length > 1) st.panel.removeChild(st.panel.lastChild);
  }

  for(i = 0; i < st.entries.length; i++){
    var e = st.entries[i], allOk = true;

    if(e.kind === "input" || e.kind === "match"){
      for(j = 0; j < e.inputs.length; j++){
        var f = e.inputs[j];
        var ok = matches(f.el.value, f.answers);
        markInput(f.el, ok);
        total++;
        if(ok) got++; else allOk = false;
      }
    }
    if(e.kind === "match"){
      var okL = e.select.value === e.data.letter;
      markInput(e.select, okL);
      total++;
      if(okL) got++; else allOk = false;
    }
    if(e.kind === "pick"){
      var sel = parseInt(e.group.getAttribute("data-sel"), 10);
      for(j = 0; j < e.btns.length; j++){
        e.btns[j].classList.remove("on", "good", "bad");
        if(j === e.data.correct) e.btns[j].classList.add("good");
        else if(j === sel) e.btns[j].classList.add("bad");
      }
      total++;
      if(sel === e.data.correct) got++; else allOk = false;
    }

    var answer = e.data.solution || null;
    if(e.kind === "match") answer = e.data.solution + "  →  " + e.data.letter;
    if(e.kind === "pick")  answer = e.data.options[e.data.correct];

    var boxNode = explainBox(allOk, answer, e.data.why, e.data.tip);
    if(e.exp){
      e.exp.appendChild(boxNode);
    }else{
      var wrapItem = el("div", "expitem");
      wrapItem.appendChild(el("span", "en", String(e.data.n)));
      wrapItem.appendChild(boxNode);
      st.panel.appendChild(wrapItem);
    }
  }

  if(st.panel) st.panel.hidden = false;
  if(st.chips) markChips(st);

  st.score.textContent = got + " / " + total + " right";
  setQuest(key, got, total);
}
function markChips(st){
  var t = st.data, used = {}, i;
  used[t.boxUsedInExample] = true;
  for(i = 0; i < st.entries.length; i++){
    var e = st.entries[i];
    if(e.inputs && matches(e.inputs[0].el.value, e.inputs[0].answers)) used[e.data.verb] = true;
  }
  var chips = st.chips.childNodes;
  for(i = 0; i < chips.length; i++){
    var w = chips[i].textContent;
    if(w === t.boxUsedInExample) chips[i].className = "vchip done";
    else chips[i].className = used[w] ? "vchip used" : "vchip";
  }
}
function resetTrial(key){
  renderTrial(key);
  resetQuest(key);
}

/* ============================================================
   CODEX
   ============================================================ */
var codexBody = document.getElementById("codexBody");
var codexToggle = document.getElementById("codexToggle");
(function renderCodex(){
  for(var i = 0; i < DATA.codex.length; i++){
    var g = DATA.codex[i];
    var b = el("div", "gbox");
    b.appendChild(el("h4", null, g.name));
    b.appendChild(el("p", "pat", g.pattern));
    var ps = el("div", "pairs");
    for(var j = 0; j < g.pairs.length; j++){
      var c = el("span", "pchip");
      c.appendChild(document.createTextNode(g.pairs[j][0] + " → "));
      c.appendChild(el("b", null, g.pairs[j][1]));
      ps.appendChild(c);
    }
    b.appendChild(ps);
    codexBody.appendChild(b);
  }
})();
codexToggle.addEventListener("click", function(){
  var open = codexBody.classList.toggle("hidden") === false;
  codexToggle.textContent = open ? "Close the codex" : "Open the codex";
});

/* ============================================================
   ARRANQUE
   ============================================================ */
buildTrials();

})();
</script>

<script id="report-block">
/* ============================================================
   EL INFORME PARA LA DOCENTE
   ============================================================
   Un solo modulo para las catorce paginas. NO toca ningun motor:
   lee lo que ya esta en pantalla cuando el alumno aprieta "Check
   my answers" (las medallas, los carteles de explicacion, los
   inputs marcados en rojo) y lo guarda en el navegador.

   Todo el sitio vive en el mismo dominio, asi que el home puede
   juntar lo de todas las paradas y mandar un solo informe.

   El envio va a un Web App de Apps Script pegado a la planilla de
   resultados: escribe la fila y le manda el mail a la docente que
   el alumno elige. Se intenta leyendo la respuesta del servidor, y
   si eso se cae, a ciegas. Igual siempre queda el boton de copiar,
   que funciona aunque no haya internet.
   ============================================================ */
(function(){
"use strict";

/* ---------- a donde va el resultado ----------
   Un Web App de Apps Script pegado a la planilla "Present Perfect -
   Resultados": escribe la fila y le manda el mail a la docente elegida.
   Mientras esta vacio, la tarjeta solo deja copiar el informe. */
var APPS = {
  url: "https://script.google.com/macros/s/AKfycbz4mC6wlKjs_tQHfEjCxDOfbYjYAzDui3pZFttOfFgpxhd4WpLmaE-2WRsJ_edVPz3-ow/exec"
};
var PUEDE_ENVIAR = !!APPS.url;

/* Las tres docentes. El alumno ve el nombre; lo que viaja es el mail, y el
   script del otro lado solo acepta estos tres. */
var DOCENTES = [
  { nombre: "Ani",  mail: "anabella_ld@buber.edu.ar" },
  { nombre: "Pao",  mail: "paolafreiberg@buber.edu.ar" },
  { nombre: "Mari", mail: "marisaolivero@buber.edu.ar" }
];

/* Los tres cursos. Tambien es una lista cerrada: asi en la planilla el curso
   se puede filtrar y ordenar, en vez de tener "6-1", "6 1", "sexto 1"... */
var CURSOS = ["6-1", "6-2", "6-3"];

var KEY = "ppq.report.v1";
var wrap = document.querySelector(".wrap");
if(!wrap) return;

/* ---------- memoria del navegador, siempre con red ---------- */
function leer(){
  try{
    var raw = window.localStorage.getItem(KEY);
    var o = raw ? JSON.parse(raw) : null;
    if(!o || typeof o !== "object") o = {};
    if(!o.stops) o.stops = {};
    return o;
  }catch(e){ return { stops: {} }; }
}
function guardar(o){
  try{ window.localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
}

/* ---------- que pagina es esta ---------- */
function slug(){
  var p = window.location.pathname.split("/").pop() || "index.html";
  return p.replace(/\.html?$/i, "") || "index";
}
var SLUG = slug();
/* El home se reconoce por sus tarjetas de parada, no por el nombre del
   archivo: abierto desde un pendrive la URL no sirve de nada. */
var ES_HOME = !!document.querySelector(".stop a.enter");
function tituloPagina(){
  var h = document.querySelector(".hero h1") || document.querySelector("h1");
  return h ? h.textContent.trim() : document.title;
}

/* ---------- helpers ---------- */
function texto(n){ return n ? String(n.textContent).replace(/\s+/g, " ").trim() : ""; }
function parseScore(s){
  var m = /(\d+)\s*\/\s*(\d+)/.exec(s || "");
  return m ? { got: parseInt(m[1], 10), total: parseInt(m[2], 10) } : null;
}

/* ============================================================
   LEER LA PANTALLA
   Cinco de las seis clases de pagina muestran las medallas con
   el nombre del trial y el puntaje; los errores salen de las
   cajas de explicacion en rojo.
   ============================================================ */
function numeroDe(caja){
  /* la caja pegada al item: el numero esta en el .rn de arriba */
  var it = caja.closest ? caja.closest(".item") : null;
  if(it){
    var rn = it.querySelector(".rn");
    if(rn) return { n: texto(rn), cont: it };
  }
  /* la caja del panel numerado: el numero es el hermano .en */
  var pi = caja.parentNode;
  if(pi && pi.className && String(pi.className).indexOf("expitem") >= 0){
    var en = pi.querySelector(".en");
    return { n: texto(en), cont: null };
  }
  return { n: "", cont: null };
}
function loQueEscribio(cont, n, tarjeta){
  var partes = [], i;
  /* lo que quedo marcado en rojo dentro del item */
  var malos = cont ? cont.querySelectorAll("input.no, select.no, .schip.no") : [];
  for(i = 0; i < malos.length; i++){
    var v = malos[i].value !== undefined ? malos[i].value : texto(malos[i]);
    partes.push(String(v).trim() || "-");
  }
  if(partes.length) return partes.join(" + ");
  /* si la explicacion vive en el panel, se busca el item por su numero */
  if(!cont && tarjeta && n){
    var marcas = tarjeta.querySelectorAll(".rn, .sn, .gn");
    for(i = 0; i < marcas.length; i++){
      if(texto(marcas[i]) === n){
        var padre = marcas[i].parentNode;
        if(padre && padre.className && String(padre.className).indexOf("schip") >= 0){
          /* la piedra guarda la columna en .value; el texto de la piedra va
             despues del numerito, y el numerito se saca por su largo (no con
             una expresion, que se comeria una piedra como "2019") */
          var col = String(padre.value || "").trim();
          var etiqueta = texto(padre);
          var sn = padre.querySelector(".sn");
          if(sn) etiqueta = etiqueta.slice(texto(sn).length).trim();
          return col ? (col + " " + etiqueta) : "-";
        }
        var caja2 = padre ? padre.parentNode : null;
        var ins = caja2 ? caja2.querySelectorAll("input.no, .pickbtn.bad") : [];
        if(ins.length){
          var out = [];
          for(var k = 0; k < ins.length; k++){
            out.push(String(ins[k].value !== undefined && ins[k].value !== "" ? ins[k].value : texto(ins[k])).trim() || "-");
          }
          return out.join(" + ");
        }
      }
    }
  }
  return "-";
}
function mirarPantalla(){
  var partes = [], errores = [], i;

  var medallas = document.querySelectorAll(".medal");
  for(i = 0; i < medallas.length; i++){
    var nom = texto(medallas[i].querySelector(".mt"));
    var sc = parseScore(texto(medallas[i].querySelector(".ms")));
    if(nom) partes.push({ name: nom, got: sc ? sc.got : null, total: sc ? sc.total : null });
  }

  /* si no hay medallas, vale cualquier marcador de la pagina */
  if(!partes.length){
    var lineas = document.querySelectorAll(".scoreline");
    for(i = 0; i < lineas.length; i++){
      var s2 = parseScore(texto(lineas[i]));
      if(s2) partes.push({ name: "Exercise " + (partes.length + 1), got: s2.got, total: s2.total });
    }
  }

  /* las puertas de la ciudadela: cada juego ganado deja su insignia */
  var insignias = document.querySelectorAll(".gamecard .done");
  if(insignias.length){
    var abiertas = 0;
    for(i = 0; i < insignias.length; i++){
      if(String(insignias[i].className).indexOf("hidden") < 0) abiertas++;
    }
    partes.push({ name: "Doors open", got: abiertas, total: insignias.length });
  }

  var malas = document.querySelectorAll(".exp.wrong");
  for(i = 0; i < malas.length; i++){
    var caja = malas[i];
    var tarjeta = caja.closest ? caja.closest(".card") : null;
    var quien = tarjeta ? texto(tarjeta.querySelector("h2")) : "";
    var d = numeroDe(caja);
    var sol = texto(caja.querySelector(".sol")).replace(/^Answer:\s*/i, "");
    var escribio = loQueEscribio(d.cont, d.n, tarjeta);
    /* El speed run del Vault muestra su explicacion sin numero ni linea de
       respuesta: sin eso el renglon no le dice nada a la docente, asi que no
       va. El puntaje de la carrera igual queda arriba. */
    if(sol || escribio !== "-"){
      errores.push({ trial: quien, n: d.n, right: sol, was: escribio });
    }
  }

  var got = 0, total = 0;
  for(i = 0; i < partes.length; i++){
    if(partes[i].total){ got += partes[i].got || 0; total += partes[i].total; }
  }
  /* Entrar a una pagina no es haberla hecho: hasta que no corrige algo o gana
     algo, no hay nada que contar. Si no, la ciudadela recien abierta ya
     informaria "0 / 5 puertas". */
  var hizo = (got > 0) || document.querySelectorAll(".exp").length > 0;
  return { parts: partes, wrong: errores, got: got, total: total, hizo: hizo };
}

/* ---------- guardar lo de esta parada ---------- */
function anotar(){
  if(ES_HOME) return null;
  var r = mirarPantalla();
  if(!r.total || !r.hizo) return r;
  var o = leer();
  o.stops[SLUG] = {
    title: tituloPagina(),
    got: r.got, total: r.total,
    parts: r.parts, wrong: r.wrong,
    when: new Date().toISOString().slice(0, 10)
  };
  guardar(o);
  return r;
}

/* ============================================================
   EL TEXTO DEL INFORME
   ============================================================ */
function bloque(titulo, d){
  var L = [], i;
  L.push(titulo.toUpperCase() + "  -  " + d.got + " / " + d.total);
  for(i = 0; i < d.parts.length; i++){
    var p = d.parts[i];
    if(p.total) L.push("   " + p.name + ": " + p.got + " / " + p.total);
  }
  if(d.wrong && d.wrong.length){
    L.push("   To look at again:");
    for(i = 0; i < d.wrong.length; i++){
      var w = d.wrong[i];
      L.push("    - " + (w.trial ? w.trial + " " : "") + (w.n ? "(" + w.n + ") " : "")
             + "wrote: " + w.was + "  ->  right: " + w.right);
    }
  }
  return L.join("\n");
}
function informe(){
  var o = leer(), L = [], k;
  if(ES_HOME){
    var hubo = false, got = 0, total = 0;
    for(k in o.stops){
      if(Object.prototype.hasOwnProperty.call(o.stops, k)){
        var d = o.stops[k];
        L.push(bloque(d.title + "  (" + d.when + ")", d));
        L.push("");
        got += d.got; total += d.total;
        hubo = true;
      }
    }
    if(!hubo) return null;
    L.unshift("WHOLE QUEST: " + got + " / " + total + "\n");
    return { texto: L.join("\n"), got: got, total: total, stop: "Whole quest" };
  }
  var r = mirarPantalla();
  if(!r.total || !r.hizo) return null;
  return { texto: bloque(tituloPagina(), r), got: r.got, total: r.total, stop: tituloPagina() };
}

/* ============================================================
   LA TARJETA
   ============================================================ */
var opciones = "";
for(var di = 0; di < DOCENTES.length; di++){
  opciones += '<option value="' + DOCENTES[di].mail + '">' + DOCENTES[di].nombre + '</option>';
}
var cursos = "";
for(var ci = 0; ci < CURSOS.length; ci++){
  cursos += '<option value="' + CURSOS[ci] + '">' + CURSOS[ci] + '</option>';
}

var card = document.createElement("section");
card.className = "card rpcard";
card.innerHTML =
  '<span class="tag">Your report</span>' +
  '<h2>' + (PUEDE_ENVIAR
    ? (ES_HOME ? "Send your quest to your teacher" : "Send your result to your teacher")
    : (ES_HOME ? "Your quest so far" : "Your report")) + '</h2>' +
  '<p class="sub">' + (PUEDE_ENVIAR
    ? (ES_HOME
       ? "This is everything you have done in the quest on this computer. Write your name, choose your class &amp; your teacher and then press the button."
       : "Check your answers first. Then write your name, choose your class &amp; your teacher and then press the button.")
    : (ES_HOME
       ? "This is everything you have done in the quest on this computer. Write your name and copy it to give it to your teacher."
       : "Check your answers first, then write your name and copy your report. It says how many you got right and which ones to look at again.")) +
  '</p>' +
  '<div class="rprow">' +
    '<label>Name<input type="text" id="rpName" autocomplete="off" placeholder="Your name"></label>' +
    '<label>Class<select id="rpClass">' +
      '<option value="">Choose your class</option>' + cursos +
    '</select></label>' +
    (PUEDE_ENVIAR ? '<label>Teacher<select id="rpTeacher">' +
      '<option value="">Choose your teacher</option>' + opciones +
    '</select></label>' : "") +
  '</div>' +
  /* El informe NO se le muestra al alumno: la tarjeta es nombre, curso,
     docente y el boton. Lo que se manda sigue siendo lo mismo.
     El boton de copiar nace escondido: aparece solo si un envio falla, para
     que el chico tenga como pasarle el resultado a la docente igual. */
  '<div class="btnrow">' +
    (PUEDE_ENVIAR ? '<button class="btn" id="rpSend" type="button">Send to my teacher</button>' : "") +
    '<button class="btn ghost" id="rpCopy" type="button"' + (PUEDE_ENVIAR ? ' hidden' : '') + '>Copy my report</button>' +
  '</div>' +
  '<p class="rpmsg" id="rpMsg"></p>' +
  '<p class="rpfine">Only your name, your class and your answers go to the teacher you choose. Nothing else.</p>';

/* Va donde termina el resultado: pegada al final de los trials y antes del
   codex, no al final de todo. */
var trials = document.getElementById("trials");
var codex = document.getElementById("codexCard");
var nav = document.querySelector("nav.bottomnav");
if(trials && trials.parentNode === wrap && trials.nextSibling) wrap.insertBefore(card, trials.nextSibling);
else if(codex && codex.parentNode === wrap) wrap.insertBefore(card, codex);
else if(nav && nav.parentNode === wrap) wrap.insertBefore(card, nav);
else wrap.appendChild(card);

var elName = document.getElementById("rpName");
var elClass = document.getElementById("rpClass");
var elTeacher = document.getElementById("rpTeacher");
var elMsg = document.getElementById("rpMsg");
var elSend = document.getElementById("rpSend");
var elCopy = document.getElementById("rpCopy");

/* Las tres casillas arrancan VACIAS, siempre, en todas las paginas.
   Antes se recordaban para que el chico escribiera su nombre una sola vez, y
   estaba mal: estas maquinas se comparten. El que se sentaba despues se
   encontraba el nombre, el curso y la docente del anterior ya puestos, y con
   apretar el boton mandaba su trabajo con el nombre de otro, o a la docente
   equivocada. Se escribe cada vez: son cinco segundos. */
(function limpiarViejo(){
  /* y se borra lo que haya quedado guardado de la version anterior */
  var o = leer();
  if(o.name || o.klass || o.teacher){
    delete o.name; delete o.klass; delete o.teacher;
    guardar(o);
  }
})();

/* ---------- el boton que baja hasta la tarjeta ----------
   Va en la misma fila que "Check my answers", que es donde el alumno esta
   mirando cuando aparece el puntaje. */
function ponerAtajos(){
  var cards = document.querySelectorAll("#trials .card, .gamecard");
  for(var i = 0; i < cards.length; i++){
    var c = cards[i];
    if(c === card || c.querySelector(".rpjump")) continue;
    /* Hay resultado cuando el marcador tiene un numero (los trials) o cuando
       la insignia de puerta ganada dejo de estar oculta (la ciudadela). */
    var marcador = c.querySelector(".scoreline");
    var insignia = c.querySelector(".done");
    var hay = (marcador && /[0-9]/.test(texto(marcador))) ||
              (insignia && String(insignia.className).indexOf("hidden") < 0);
    if(!hay) continue;
    var fila = c.querySelector(".btnrow");
    if(!fila) continue;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn ghost rpjump";
    b.textContent = PUEDE_ENVIAR ? "Send this to my teacher" : "See my report";
    b.addEventListener("click", function(){
      card.scrollIntoView({ block: "start" });
      elName.focus();
    });
    fila.appendChild(b);
  }
}

var enviado = null;   /* el texto del ultimo informe que salio */

function pintar(){
  var r = informe();
  ponerAtajos();
  /* Si el alumno siguio trabajando despues de enviar, el boton vuelve.
     Lo que se evita es mandar dos veces LO MISMO, no que entregue el trial
     que hizo despues. */
  if(elSend && enviado !== null && r && r.texto !== enviado){
    elSend.disabled = false;
    elSend.textContent = "Send my new result";
  }
}

/* cada click puede cambiar el puntaje: se vuelve a mirar la pantalla */
var pend = null;
document.addEventListener("click", function(){
  if(pend) window.clearTimeout(pend);
  pend = window.setTimeout(function(){ anotar(); pintar(); }, 250);
}, true);
window.addEventListener("pagehide", function(){ anotar(); });

function aviso(t, bien){
  elMsg.textContent = t;
  elMsg.className = "rpmsg " + (bien ? "ok" : "no");
}
function cabecera(){
  return "PRESENT PERFECT QUEST\n" +
         "Student: " + (elName.value.trim() || "(no name)") +
         "   Class: " + (elClass.value || "-") +
         "   Date: " + new Date().toISOString().slice(0, 10);
}

/* ---------- copiar: el plan B, escondido hasta que algo falle ---------- */
elCopy.addEventListener("click", function(){
  var r = informe();
  if(!r){ aviso("There is nothing to send yet.", false); return; }
  var t = cabecera() + "\n" + r.texto;
  var ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t);
      ok = true;
    }
  }catch(e){}
  if(!ok){
    try{
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e2){ ok = false; }
  }
  aviso(ok ? "Copied. Now give it to your teacher the way she asks you to."
           : "Your report could not be copied. Tell your teacher.", ok);
});

/* ============================================================
   ENVIAR AL WEB APP
   ============================================================ */
if(elSend){
  elSend.addEventListener("click", function(){
    var r = informe();
    if(!elName.value.trim()){ aviso("Write your name first.", false); elName.focus(); return; }
    if(!elClass.value){ aviso("Choose your class first.", false); elClass.focus(); return; }
    if(!elTeacher.value){ aviso("Choose your teacher first.", false); elTeacher.focus(); return; }
    if(!r){ aviso("There is nothing to send yet. Check your answers first.", false); return; }

    var datos = {
      nombre_alumno: elName.value.trim(),
      curso: elClass.value,
      docente: elTeacher.value,
      docente_nombre: elTeacher.options[elTeacher.selectedIndex].textContent,
      pagina: r.stop,
      puntaje: r.got + " / " + r.total,
      resultado: r.texto,
      timestamp: new Date().toISOString()
    };

    elSend.disabled = true;
    aviso("Sending...", true);

    var cuerpo = JSON.stringify(datos);
    /* El Content-Type va como texto plano a proposito: en no-cors el navegador
       solo acepta unos pocos, y con application/json ni sale el pedido. Del
       otro lado Apps Script lo lee igual con JSON.parse. */
    var cabeceras = { "Content-Type": "text/plain;charset=utf-8" };

    var bien = function(txt){
      enviado = r.texto;
      elSend.textContent = "Sent";
      elCopy.hidden = true;
      aviso("Sent to " + datos.docente_nombre + (txt ? ". " + txt : ".")
            + " If you do more, the button comes back.", true);
    };
    var mal = function(txt, conCopia){
      elSend.disabled = false;
      /* el cartel del boton vuelve a invitar: si quedaba "Sent" el alumno
         piensa que ya esta entregado */
      elSend.textContent = (enviado === null) ? "Send to my teacher" : "Send my new result";
      /* recien ahora aparece el plan B: el chico puede copiar su informe y
         darselo a la docente por otro camino. No cuando el problema es que ya
         lo mando hace un momento: ahi no falta nada. */
      if(conCopia !== false) elCopy.hidden = false;
      aviso(txt || "It did not go. Press the button again, or copy your report and give it to your teacher.", false);
    };

    /* ================== LEER ESTO ==================
       Primero se intenta en modo CORS, que es el bueno: Apps Script devuelve
       las cabeceras necesarias, asi que se puede LEER la respuesta y saber de
       verdad si el servidor escribio la fila ({"status":"ok"}) o si la
       rechazo. Ese "Sent" no es optimista: es lo que contesto el servidor.

       Si ese camino falla -sin internet, o un filtro de la escuela que corta
       la lectura de la respuesta- se reintenta en no-cors. AHI SI la respuesta
       es OPACA: el navegador no deja ver ni el codigo de estado ni el cuerpo,
       asi que "el pedido salio" es todo lo que sabemos. NO prueba que el
       servidor lo haya recibido, ni que se haya escrito la fila, ni que el
       mail haya salido. Por eso en ese caso el cartel lo dice distinto, y la
       unica prueba de verdad sigue estando en la planilla.
       =============================================== */
    var aCiegas = function(){
      try{
        window.fetch(APPS.url, { method: "POST", mode: "no-cors", headers: cabeceras, body: cuerpo })
          .then(function(){ bien("It could not be confirmed, so check with your teacher."); }, function(){ mal(); });
      }catch(e2){ mal(); }
    };

    try{
      window.fetch(APPS.url, { method: "POST", headers: cabeceras, body: cuerpo })
        .then(function(resp){ return resp.text(); })
        .then(function(txt){
          var o;
          try{ o = JSON.parse(txt); }catch(e3){ o = null; }
          if(o && o.status === "ok"){ bien(""); }
          else if(o && o.message === "ya enviado, espera un momento"){
            mal("You just sent this one. Wait a moment before sending it again.", false);
          }
          else if(o){ mal("The teacher's list did not take it. Tell your teacher."); }
          else { aCiegas(); }
        }, aCiegas);
    }catch(e){ aCiegas(); }
  });
}

anotar();
pintar();
})();
</script>
</body>
</html>
